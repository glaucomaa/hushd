[workspace]
resolver = "2"
members = [
    "crates/audio",
    "crates/cli",
    "crates/gaia",
    "crates/ipc",
    "crates/rfcomm",
    "crates/m4",
    "crates/m4d",
    "crates/mpris",
    "crates/tui",
    "crates/m4ctl",
    "crates/dock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
audio = { path = "crates/audio" }
gaia = { path = "crates/gaia" }
rfcomm = { path = "crates/rfcomm" }
m4 = { path = "crates/m4" }
ipc = { path = "crates/ipc" }
mpris = { path = "crates/mpris" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
